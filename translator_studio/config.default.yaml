input_video: ''
project:
  input_fingerprint: ''
work_dir: ./output
ffmpeg:
  ffmpeg_bin: ffmpeg
  ffprobe_bin: ffprobe
asr:
  model: large-v3
  model_dir: ../models/faster-whisper
  local_files_only: true
  language: zh
  device: auto
  compute_type: float16
  fallback_to_cpu: true
  cpu_compute_type: int8
  cpu_model: large-v3
  vad_filter: true
  beam_size: 5
translate:
  provider: openai
  model: gpt-4o-mini
  base_url: ''
  batch_size: 15
  style_prompt: >-
    Create a very short English voiceover script from this Chinese SRT. Do not translate word-for-word. Compress aggressively.
    Keep only the essential meaning. Remove filler, repetition, and minor details. Use the fewest natural English words possible.
    Keep SRT numbering and timestamps exactly unchanged. Do not add explanations.
tts:
  mode: external_command
  auto_run: false
  command: ''
  output_audio: ./output/en_voice.wav
  output_srt: ./output/en_synced.srt
tts_audio_edit:
  min_speed: 0.9
  max_speed: 1.25
  speed: 1.0
sync:
  prefer_tts_synced_srt: true
  use_ffsubsync: false
  ffsubsync_bin: ffsubsync
compose:
  media_fit_mode: video_segment_fit
  audio_mode: replace
  output_video: ./output/final.mp4
  video_segment_fit:
    min_speed: 0.75
    max_speed: 1.35
    merge_short_sec: 0.6
  smart_segment_fit:
    enabled: true
    max_speed: 1.5
    min_speed: 0.8
    gap_fill: silence
    silence_db: -40
    segment_padding_sec: 0.05
  fit_audio_to_video:
    enabled: true
    tolerance: 0.03
    min_speed: 0.85
    max_speed: 1.2
    srt_audio_timeline_threshold: 0.15
  cover_original_subtitle: true
  subtitle_cleanup:
    mode: delogo
    blur_radius: 12
    blur_power: 2
    region_padding: 4
    feather: 12
  cover:
    x: iw*0.080
    y: ih*0.850
    w: iw*0.840
    h: ih*0.130
    color: black@1.000
  subtitle_style: FontName=Arial,FontSize=24,PrimaryColour=&H00FFFFFF,OutlineColour=&H00000000,BackColour=&H90000000,BorderStyle=1,Outline=0,Shadow=1,Alignment=2,MarginV=10,Bold=1,Italic=0,Spacing=0
  video_codec: libx264
  crf: 18
  preset: medium
  audio_codec: aac
  audio_bitrate: 192k
  subtitle_animation: fade
