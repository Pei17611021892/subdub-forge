app:
  language: zh-CN
  theme: dark

projects_dir: ./projects
export_dir: ../export

shared:
  env_file: ../.env
  models_dir: ../models
  ffmpeg_bin: ffmpeg
  ffprobe_bin: ffprobe

story:
  output_language: en
  target_duration_sec: 90
  narrative_strategy: auto
  narrative_style: natural_science_youtube
  model: gpt-4o-mini
  editor_model: ''
  base_url: ''
  temperature: 0.55
  request_timeout_sec: 240
  planning_words_per_second: 1.45
  planning_safe_duration_sec: 174
  # 留空为标准模式；可选 low/medium/high/xhigh。接口不支持时会自动降级。
  reasoning_effort: ''
  # 最终编辑、整篇重编和配音超时精简；留空继承上面的档位。
  editor_reasoning_effort: ''

fact_review:
  auto_after_story: false
  model: ''

content_review:
  model: ''

layered_analysis:
  enabled: true
  suggestion_threshold_sec: 300
  model: ''
  temperature: 0.25
  chunk_duration_sec: 180
  max_events_per_chunk: 45
  max_chunks: 10

series:
  # 默认生成一条完整 Shorts；用户在第一步主动开启后才允许自动拆成多集。
  auto_split: false
  candidate_min_source_duration_sec: 300
  candidate_min_event_count: 80
  candidate_min_transcript_units: 500
  chinese_to_english_word_ratio: 0.62
  candidate_max_compression_ratio: 2.8
  candidate_min_dense_duration_sec: 60
  candidate_min_speech_coverage: 0.65
  candidate_min_dense_words_per_minute: 200
  candidate_min_substantive_event_count: 42
  candidate_min_technical_event_count: 8
  candidate_min_layered_critical_count: 10
  candidate_min_layered_key_fact_count: 18
  candidate_story_near_limit_ratio: 0.9
  candidate_max_draft_event_coverage: 0.4
  max_parts: 6
  target_part_duration_sec: 174
  evaluation_model: ''
  max_evaluation_events: 320

analysis:
  content_mode: speech
  asr_model: large-v3
  model_dir: ../models/faster-whisper
  auto_download_model: true
  local_files_only: true
  language: zh
  device: auto
  compute_type: float16
  cpu_compute_type: int8
  vad_filter: true
  beam_size: 5
  scene_threshold: 0.32
  min_scene_sec: 1.0
  keyframe_width: 640
  frame_sample_interval_sec: 3

vision:
  enabled: true
  model: gpt-4o-mini
  base_url: ''
  batch_size: 4
  technical_visuals_enabled: true
  high_detail_review_enabled: true
  max_high_detail_events: 6
  high_detail_batch_size: 3
  high_detail_width: 1440

quality:
  deep_scan_timeout_sec: 300
  black_min_duration_sec: 0.5
  black_picture_ratio: 0.98
  silence_min_duration_sec: 1.5
  silence_threshold_db: -45
  quiet_mean_db: -30
  loud_mean_db: -10
  clipping_peak_db: -0.1

export:
  width: 1080
  height: 1920
  fps: 30
  video_codec: libx264
  crf: 18
  preset: veryfast
  audio_bitrate: 192k
  preserve_original_audio: false
  # 是否把同步英文字幕烧录进成片；关闭后可交给外部剪辑软件处理。
  burn_subtitles: true
  original_audio_mix_volume: 0.22
  # crop_stretch 可选择画布比例并居中缩放/拉伸；另可选 vertical_blur 或 original。
  fit_mode: crop_stretch
  canvas_aspect_ratio: fit
  canvas_fixed_scale: true
  canvas_scale_x: 1.0
  canvas_scale_y: 1.0
  vertical_crop_fill_percent: 100
  vertical_background_blur_radius: 24
  cleanup_original_subtitles: false
  source_crop_height_ratio: 0.82
  subtitle_font: Arial
  subtitle_font_size: 48
  subtitle_margin_h: 72
  # 9:16 画布的默认安全位置，避开 Shorts 底部操作区。
  subtitle_margin_v: 320
  subtitle_bold: true
  subtitle_italic: false
  subtitle_color: '#FFFFFFFF'
  subtitle_outline_color: '#000000FF'
  subtitle_shadow: 1
  subtitle_spacing: 0
  subtitle_animation: fade
  subtitle_background_enabled: false
  # 文字背景类型：mask（黑色弹框）、blur（局部模糊）、delogo（周边像素修复）。
  subtitle_background_mode: mask
  subtitle_background_opacity: 0.62
  subtitle_outline_width: 3
  subtitle_box_padding: 12
  original_subtitle_cleanup_mode: mask
  original_subtitle_cleanup_x: 0.08
  original_subtitle_cleanup_y: 0.82
  original_subtitle_cleanup_width: 0.84
  original_subtitle_cleanup_height: 0.14
  original_subtitle_cleanup_opacity: 0.78
  original_subtitle_blur_radius: 12
  original_subtitle_blur_power: 2
  original_subtitle_region_padding: 4
  original_subtitle_feather: 12
